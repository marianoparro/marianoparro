# Render "Blueprint": describes the deployment so Render can set it up from
# this repo. Secrets are NOT here — `sync: false` makes Render ask for them
# in its dashboard, so they never land in git.
services:
  - type: web
    name: family-budget
    runtime: python
    rootDir: budget-tracker
    plan: starter            # a persistent disk requires a paid plan; see README
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:                    # SQLite file lives here and survives redeploys
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_PATH
        value: /var/data/budget.db
      - key: APP_USERS          # "Mariano:password,Maura:password"
        sync: false
      - key: MONTHLY_NET_INCOME
        sync: false
      - key: MONTHLY_FIXED_COSTS
        sync: false
      - key: YEARLY_SAVINGS_GOAL
        sync: false
