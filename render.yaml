# Render "Blueprint": describes the deployment so Render can set it up from
# this repo. Free plan: the app sleeps when unused (first open takes ~30-60s)
# and local files are wiped on restart, so data lives in a free hosted
# Postgres (e.g. Neon) given as DATABASE_URL. Secrets are NOT here —
# `sync: false` makes Render ask for them, so they never land in git.
services:
  - type: web
    name: family-budget
    runtime: python
    rootDir: budget-tracker
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL       # Neon connection string: postgresql://...
        sync: false
      - key: APP_USERS          # "Mariano:password,Maura:password"
        sync: false
      - key: MONTHLY_NET_INCOME
        sync: false
      - key: FIXED_COSTS        # "Rent:2500,Domestic help:1561,..."
        sync: false
      - key: YEARLY_SAVINGS_GOAL
        sync: false
      - key: ANTHROPIC_API_KEY  # optional, paid: only for the chat assistant
        sync: false
      - key: HOUSEHOLD_NOTES    # optional: facts about the family for the assistant
        sync: false
